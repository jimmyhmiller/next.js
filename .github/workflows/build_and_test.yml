# Simplified CI workflow using commands from contributing.md
# See: contributing/core/testing.md and contributing/core/building.md
#
# Local equivalents:
#   pnpm build                           - Build the project
#   pnpm lint                            - Lint (types, prettier, eslint, ast-grep)
#   pnpm types                           - TypeScript type checking
#   pnpm test-unit                       - Unit tests
#   pnpm test-dev test/path/             - Development tests (webpack)
#   pnpm test-start test/path/           - Production tests (webpack)
#   pnpm test-dev-turbo test/path/       - Development tests (turbopack)
#   pnpm test-start-turbo test/path/     - Production tests (turbopack)

name: build-and-test

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize]

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm
      - run: pnpm install
      - run: pnpm build
      - uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            packages/*/dist
            packages/next-swc/native
          key: build-${{ github.sha }}

  lint:
    name: lint
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/dist
            packages/next-swc/native
          key: build-${{ github.sha }}
      - run: pnpm install
      - run: pnpm lint

  types:
    name: types
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/dist
            packages/next-swc/native
          key: build-${{ github.sha }}
      - run: pnpm install
      - run: pnpm types

  test-unit:
    name: test-unit
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/dist
            packages/next-swc/native
          key: build-${{ github.sha }}
      - run: pnpm install
      - run: pnpm test-unit

  # Development tests with Turbopack (pnpm test-dev-turbo)
  test-dev-turbo:
    name: test-dev-turbo
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/dist
            packages/next-swc/native
          key: build-${{ github.sha }}
      - run: pnpm install
      - run: pnpm playwright install chromium
      - name: Run tests
        run: |
          node run-tests.js \
            --test-pattern '^(test\/(development|e2e))\/(?!.*next-config-ts-native).*\.test\.(js|jsx|ts|tsx)$' \
            -g ${{ matrix.group }}
        env:
          IS_TURBOPACK_TEST: 1
          TURBOPACK_DEV: 1
          NEXT_TEST_MODE: dev

  # Production tests with Turbopack (pnpm test-start-turbo)
  test-start-turbo:
    name: test-start-turbo
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/dist
            packages/next-swc/native
          key: build-${{ github.sha }}
      - run: pnpm install
      - run: pnpm playwright install chromium
      - name: Run tests
        run: |
          node run-tests.js \
            -g ${{ matrix.group }} \
            --type production
        env:
          IS_TURBOPACK_TEST: 1
          TURBOPACK_BUILD: 1
          NEXT_TEST_MODE: start

  # Development tests with Webpack (pnpm test-dev)
  test-dev-webpack:
    name: test-dev-webpack
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/dist
            packages/next-swc/native
          key: build-${{ github.sha }}
      - run: pnpm install
      - run: pnpm playwright install chromium
      - name: Run tests
        run: |
          node run-tests.js \
            -g ${{ matrix.group }} \
            --type development
        env:
          IS_WEBPACK_TEST: 1
          NEXT_TEST_MODE: dev

  # Production tests with Webpack (pnpm test-start)
  test-start-webpack:
    name: test-start-webpack
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/dist
            packages/next-swc/native
          key: build-${{ github.sha }}
      - run: pnpm install
      - run: pnpm playwright install chromium
      - name: Run tests
        run: |
          node run-tests.js \
            -g ${{ matrix.group }} \
            --type production
        env:
          IS_WEBPACK_TEST: 1
          NEXT_TEST_MODE: start

  # Integration tests
  test-integration:
    name: test-integration
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/dist
            packages/next-swc/native
          key: build-${{ github.sha }}
      - run: pnpm install
      - run: pnpm playwright install chromium
      - name: Run tests
        run: |
          node run-tests.js \
            -g ${{ matrix.group }} \
            --type integration

  tests-pass:
    needs:
      [
        build,
        lint,
        types,
        test-unit,
        test-dev-turbo,
        test-start-turbo,
        test-dev-webpack,
        test-start-webpack,
        test-integration,
      ]
    if: always()
    runs-on: ubuntu-latest
    name: thank you, next
    steps:
      - run: exit 1
        if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
