# Simplified CI workflow using commands from contributing.md
# See: contributing/core/testing.md and contributing/core/building.md
#
# Local equivalents:
#   pnpm build                           - Build the project
#   pnpm lint                            - Lint (types, prettier, eslint, ast-grep)
#   pnpm types                           - TypeScript type checking
#   pnpm test-unit                       - Unit tests
#   pnpm test-dev test/path/             - Development tests (webpack)
#   pnpm test-start test/path/           - Production tests (webpack)
#   pnpm test-dev-turbo test/path/       - Development tests (turbopack)
#   pnpm test-start-turbo test/path/     - Production tests (turbopack)

name: build-and-test

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize]

env:
  NODE_LTS_VERSION: 22

jobs:
  changes:
    name: Determine changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 25

      - name: check for docs only change
        id: docs-change
        run: |
          echo "DOCS_ONLY<<EOF" >> $GITHUB_OUTPUT;
          echo "$(node scripts/run-for-change.mjs --not --type docs --exec echo 'false')" >> $GITHUB_OUTPUT;
          echo 'EOF' >> $GITHUB_OUTPUT

    outputs:
      docs-only: ${{ steps.docs-change.outputs.DOCS_ONLY != 'false' }}

  build:
    name: build
    needs: ['changes']
    if: ${{ needs.changes.outputs.docs-only == 'false' }}
    uses: ./.github/workflows/build_reusable.yml
    with:
      stepName: 'build'
    secrets: inherit

  lint:
    name: lint
    needs: ['build']
    uses: ./.github/workflows/build_reusable.yml
    with:
      afterBuild: pnpm lint
      stepName: 'lint'
    secrets: inherit

  types:
    name: types
    needs: ['build']
    uses: ./.github/workflows/build_reusable.yml
    with:
      afterBuild: pnpm types
      stepName: 'types'
    secrets: inherit

  test-unit:
    name: test-unit
    needs: ['build']
    uses: ./.github/workflows/build_reusable.yml
    with:
      afterBuild: pnpm test-unit
      stepName: 'test-unit'
    secrets: inherit

  # Development tests with Turbopack (pnpm test-dev-turbo)
  test-dev-turbo:
    name: test-dev-turbo
    needs: ['build']
    strategy:
      fail-fast: false
      matrix:
        group: [1/4, 2/4, 3/4, 4/4]
    uses: ./.github/workflows/build_reusable.yml
    with:
      afterBuild: |
        export IS_TURBOPACK_TEST=1
        export TURBOPACK_DEV=1
        export NEXT_TEST_MODE=dev
        node run-tests.js \
          --test-pattern '^(test\/(development|e2e))/.*\.test\.(js|jsx|ts|tsx)$' \
          -g ${{ matrix.group }}
      stepName: 'test-dev-turbo-${{ matrix.group }}'
    secrets: inherit

  # Production tests with Turbopack (pnpm test-start-turbo)
  test-start-turbo:
    name: test-start-turbo
    needs: ['build']
    strategy:
      fail-fast: false
      matrix:
        group: [1/4, 2/4, 3/4, 4/4]
    uses: ./.github/workflows/build_reusable.yml
    with:
      afterBuild: |
        export IS_TURBOPACK_TEST=1
        export TURBOPACK_BUILD=1
        export NEXT_TEST_MODE=start
        node run-tests.js \
          -g ${{ matrix.group }} \
          --type production
      stepName: 'test-start-turbo-${{ matrix.group }}'
    secrets: inherit

  # Development tests with Webpack (pnpm test-dev)
  test-dev-webpack:
    name: test-dev-webpack
    needs: ['build']
    strategy:
      fail-fast: false
      matrix:
        group: [1/4, 2/4, 3/4, 4/4]
    uses: ./.github/workflows/build_reusable.yml
    with:
      afterBuild: |
        export IS_WEBPACK_TEST=1
        export NEXT_TEST_MODE=dev
        node run-tests.js \
          -g ${{ matrix.group }} \
          --type development
      stepName: 'test-dev-webpack-${{ matrix.group }}'
    secrets: inherit

  # Production tests with Webpack (pnpm test-start)
  test-start-webpack:
    name: test-start-webpack
    needs: ['build']
    strategy:
      fail-fast: false
      matrix:
        group: [1/4, 2/4, 3/4, 4/4]
    uses: ./.github/workflows/build_reusable.yml
    with:
      afterBuild: |
        export IS_WEBPACK_TEST=1
        export NEXT_TEST_MODE=start
        node run-tests.js \
          -g ${{ matrix.group }} \
          --type production
      stepName: 'test-start-webpack-${{ matrix.group }}'
    secrets: inherit

  # Integration tests
  test-integration:
    name: test-integration
    needs: ['build']
    strategy:
      fail-fast: false
      matrix:
        group: [1/4, 2/4, 3/4, 4/4]
    uses: ./.github/workflows/build_reusable.yml
    with:
      afterBuild: |
        node run-tests.js \
          -g ${{ matrix.group }} \
          --type integration
      stepName: 'test-integration-${{ matrix.group }}'
    secrets: inherit

  tests-pass:
    needs:
      [
        'build',
        'lint',
        'types',
        'test-unit',
        'test-dev-turbo',
        'test-start-turbo',
        'test-dev-webpack',
        'test-start-webpack',
        'test-integration',
      ]
    if: always()
    runs-on: ubuntu-latest
    name: thank you, next
    steps:
      - run: exit 1
        if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
